<!DOCTYPE html>
<html lang="en">
<head>
    <title>ProcessHub - Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <!-- Left Side: Form -->
         <div class="login-form-section">
            <div class="brand-logo">
                <div class="logo-icon"></div>
                <h1>Join ProcessHub</h1>
            </div>
            
            <div class="signup-container">
                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Full Name">
                </div>
                <div class="input-group">
                    <label for="emp-id">Employee ID</label>
                    <input type="text" id="signup-emp-id" placeholder="ex.: 12346">
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="ex.:john@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="signup-pass" placeholder="at least 8 characters">
                </div>
                <button type="submit" class="sign-in-btn" onclick="handleSignUp()">Create Account</button>
                <p class="footer-text">Already have an account? <a href="index.html">Login</a></p>
            </div>
        </div>
        <!-- Right Side: Decorative Image -->
        <div class="login-image-section">
            <div class="image-overlay"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
