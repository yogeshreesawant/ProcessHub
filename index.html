<!DOCTYPE html>
<html lang="en">
<head>
    <title>ProcessHub - One Stop Solution for Project Management</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ProcessHub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for that clean sans-serif look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <!-- Left Side: Form -->
        <div class="login-form-section">
            <div class="brand-logo">
                <div class="logo-icon"></div>
                <!-- <span>ProcessHub</span> -->
            </div>

            <h1>Welcome Back</h1>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">UserId</label>
                    <input type="userid" id="userid" placeholder="Username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="at least 8 characters" required>
                </div>

                <div class="forgot-link">
                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </div>

                <button type="submit" class="sign-in-btn">Sign in</button>
            </form>

            <p class="footer-text">
                Don't you have an account? <a href="signup.html">Sign up</a>
            </p>
        </div>

        <!-- Right Side: Decorative Image -->
        <div class="login-image-section">
            <div class="image-overlay"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
